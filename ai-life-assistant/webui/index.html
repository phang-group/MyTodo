<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Approval Queue</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2em;
        }

        .item {
            border: 1px solid #ccc;
            padding: 1em;
            margin-bottom: 1em;
        }

        .pending {
            background: #fffbe6;
        }

        .approved {
            background: #e6ffed;
        }

        .rejected {
            background: #ffe6e6;
        }

        button {
            margin-right: 1em;
        }
    </style>
</head>

<body>
    <h1>Approval Queue</h1>
    <div id="queue"></div>
    <script>
        async function fetchQueue() {
            const res = await fetch('http://localhost:5003/queue');
            const data = await res.json();
            const queueDiv = document.getElementById('queue');
            queueDiv.innerHTML = '';
            data.queue.forEach(item => {
                const div = document.createElement('div');
                div.className = `item ${item.status}`;
                div.innerHTML = `<b>Type:</b> ${item.type}<br>
                    <b>Content:</b> <pre>${item.content}</pre><br>
                    <b>Confidence:</b> ${item.confidence} | <b>Risk:</b> ${item.risk}<br>
                    <b>Status:</b> ${item.status}<br>
                    <button onclick="approve('${item.id}')">Approve</button>
                    <button onclick="reject('${item.id}')">Reject</button>`;
                queueDiv.appendChild(div);
            });
        }
        async function approve(id) {
            await fetch('http://localhost:5003/approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchQueue();
        }
        async function reject(id) {
            await fetch('http://localhost:5003/reject', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            fetchQueue();
        }
        fetchQueue();
        setInterval(fetchQueue, 3000);
    </script>
</body>

</html>
