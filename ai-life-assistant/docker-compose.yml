version: '3.8'
services:
  injection-filter:
    build: ./services/injection_filter
    volumes:
      - ./data:/data
      - ./logs:/logs
    network_mode: host
  indexer:
    build: ./services/indexer
    volumes:
      - ./data:/data
      - ./logs:/logs
    network_mode: host
  approval-queue:
    build: ./services/approval_queue
    volumes:
      - ./data:/data
      - ./logs:/logs
    network_mode: host
  webui:
    build: ./webui
    ports:
      - "8080:80"
    network_mode: host
