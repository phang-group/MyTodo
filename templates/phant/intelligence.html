{% extends "base.html" %}
{% block title %}PHANT — Decisions & Outcomes{% endblock %}

{% block content %}
<div class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-gray-900">Decisions</h1>
      <p class="text-sm text-gray-400 mt-0.5">Founder Intelligence Dataset</p>
    </div>
    <div class="flex items-center gap-2">
      <a href="/phant" class="text-sm text-gray-500 hover:text-gray-900 px-3 py-1.5 rounded-lg hover:bg-gray-100">Brief</a>
      <button onclick="document.getElementById('add-decision-modal').classList.remove('hidden')"
        class="bg-gray-900 text-white text-sm px-4 py-1.5 rounded-lg hover:bg-gray-700">+ Decision</button>
    </div>
  </div>

  <!-- Calibration card -->
  <div class="phant-card" id="calibration-card">
    <span class="phant-section-label">Calibration Signal</span>
    <div id="cal-loading" class="text-xs text-gray-300">Loading...</div>
  </div>

  <!-- Decisions list -->
  <div class="phant-card">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <span class="phant-section-label">All Decisions</span>
      <div class="flex gap-2">
        <select id="domain-filter" onchange="loadDecisions()"
          class="text-xs border border-gray-200 rounded-lg px-2 py-1 text-gray-600">
          <option value="">All domains</option>
          <option value="product">Product</option>
          <option value="distribution">Distribution</option>
          <option value="finance">Finance</option>
          <option value="hiring">Hiring</option>
          <option value="operations">Operations</option>
          <option value="personal">Personal</option>
        </select>
      </div>
    </div>
    <div id="decisions-list">
      <div class="text-xs text-gray-300">Loading...</div>
    </div>
  </div>

</div>

<!-- Add Decision Modal -->
<div id="add-decision-modal" class="hidden fixed inset-0 z-[300] flex items-end sm:items-center justify-center bg-black/40">
  <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg max-h-[85vh] overflow-y-auto p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-bold text-gray-900">Record Decision</h2>
      <button onclick="document.getElementById('add-decision-modal').classList.add('hidden')"
        class="text-gray-400 hover:text-gray-700">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form onsubmit="submitDecision(event)" class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">Title</label>
        <input name="title" required placeholder="What did you decide?"
          class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-gray-400"/>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">Situation</label>
        <textarea name="situation" rows="2" required placeholder="What problem were you solving?"
          class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-gray-400 resize-none"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">Chosen Option</label>
        <input name="chosen_option" required placeholder="What did you choose?"
          class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-gray-400"/>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">Reasoning</label>
        <textarea name="reasoning" rows="2" placeholder="Why this option?"
          class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-gray-400 resize-none"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">Domain</label>
        <select name="domain"
          class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-gray-400">
          <option value="general">General</option>
          <option value="product">Product</option>
          <option value="distribution">Distribution</option>
          <option value="finance">Finance</option>
          <option value="hiring">Hiring</option>
          <option value="operations">Operations</option>
          <option value="personal">Personal</option>
        </select>
      </div>
      <div id="dec-error" class="hidden text-xs text-red-500"></div>
      <button type="submit"
        class="w-full bg-gray-900 text-white text-sm font-semibold py-2.5 rounded-xl hover:bg-gray-700">
        Save Decision
      </button>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
loadDecisions();
loadCalibration();

async function loadDecisions() {
  const domain = document.getElementById('domain-filter')?.value || '';
  const url = '/phant/decisions?with_outcomes=true&limit=50' + (domain ? '&domain=' + domain : '');
  try {
    const r = await fetch(url);
    const d = await r.json();
    renderDecisions(d.decisions || []);
  } catch(_) {}
}

async function loadCalibration() {
  try {
    const r = await fetch('/phant/calibration');
    const d = await r.json();
    const el = document.getElementById('cal-loading');
    if (d.sample_size === 0) {
      el.textContent = 'No calibration data yet. Record outcomes to see how PHANT tracks.';
      return;
    }
    const signal = {'calibrated_positive':'PHANT tracking well','tracking':'Tracking','miscalibrated':'PHANT miscalibrated — review recommendations','neutral':'Neutral','insufficient_data':'Insufficient data'}[d.accuracy_signal] || d.accuracy_signal;
    el.innerHTML = `
      <div class="flex flex-wrap gap-4 text-sm">
        <span><strong>${d.sample_size}</strong> outcomes sampled</span>
        <span>Mean delta: <strong>${d.mean_delta != null ? (d.mean_delta > 0 ? '+' : '') + d.mean_delta : '—'}</strong></span>
        <span>Signal: <strong>${esc(signal)}</strong></span>
      </div>`;
  } catch(_) {}
}

function renderDecisions(items) {
  const el = document.getElementById('decisions-list');
  if (!items.length) { el.innerHTML = '<span class="text-xs text-gray-300">No decisions recorded yet.</span>'; return; }
  el.innerHTML = items.map(function(d) {
    const outcome = d.outcome;
    const outcomeHtml = outcome
      ? `<span class="phant-badge phant-badge-${ outcome.outcome_type === 'success' ? 'goal' : outcome.outcome_type === 'failure' ? 'risk' : 'fact' }">${esc(outcome.outcome_type)}</span>`
      : '<span class="text-xs text-gray-300">No outcome</span>';
    const domain = d.domain || 'general';
    return `<div class="phant-table-row items-start">
      <div class="flex flex-col flex-1 gap-0.5">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-gray-800">${esc(d.title)}</span>
          <span class="phant-badge phant-badge-decision">${esc(domain)}</span>
        </div>
        <span class="text-xs text-gray-400">${esc((d.chosen_option||'').slice(0,80))}</span>
      </div>
      <div class="flex flex-col items-end gap-1 flex-shrink-0">
        ${outcomeHtml}
        ${d.decided_at ? `<span class="text-xs text-gray-300">${new Date(d.decided_at).toLocaleDateString()}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

async function submitDecision(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {
    title:          fd.get('title'),
    situation:      fd.get('situation'),
    chosen_option:  fd.get('chosen_option'),
    reasoning:      fd.get('reasoning') || '',
    domain:         fd.get('domain') || 'general',
    status:         'confirmed',
  };
  try {
    const r = await fetch('/phant/decisions', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('failed');
    document.getElementById('add-decision-modal').classList.add('hidden');
    e.target.reset();
    loadDecisions();
  } catch(_) {
    document.getElementById('dec-error').textContent = 'Save failed. Try again.';
    document.getElementById('dec-error').classList.remove('hidden');
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
{% endblock %}
