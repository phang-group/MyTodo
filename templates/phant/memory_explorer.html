{% extends "base.html" %}
{% block title %}PHANT — Memory Explorer{% endblock %}

{% block content %}
<div class="space-y-5">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-gray-900">Memory Explorer</h1>
      <p class="text-sm text-gray-400 mt-0.5">Belief corpus</p>
    </div>
    <div class="flex items-center gap-2">
      <a href="/phant" class="text-sm text-gray-500 hover:text-gray-900 px-3 py-1.5 rounded-lg hover:bg-gray-100">Brief</a>
      <button onclick="document.getElementById('add-memory-modal').classList.remove('hidden')"
        class="bg-gray-900 text-white text-sm px-4 py-1.5 rounded-lg hover:bg-gray-700">+ Memory</button>
    </div>
  </div>

  <!-- Filters -->
  <div class="phant-card">
    <div class="flex flex-wrap gap-3 items-center">
      <input id="search-input" type="text" placeholder="Search memories..."
        class="flex-1 min-w-[150px] text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-gray-400"
        onkeyup="debounceLoad()"/>
      <select id="type-filter" onchange="loadMemories()"
        class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-600">
        <option value="">All types</option>
        <option value="fact">Fact</option>
        <option value="belief">Belief</option>
        <option value="goal">Goal</option>
        <option value="commitment">Commitment</option>
        <option value="risk">Risk</option>
        <option value="opportunity">Opportunity</option>
        <option value="pattern">Pattern</option>
        <option value="preference">Preference</option>
        <option value="identity">Identity</option>
        <option value="observation">Observation</option>
      </select>
      <select id="product-filter" onchange="loadMemories()"
        class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 text-gray-600">
        <option value="">All products</option>
        <option value="mytodo">MyTodo</option>
        <option value="infopro">InfoPro</option>
        <option value="nextdoor">NextDoor</option>
        <option value="phant">PHANT</option>
        <option value="manual">Manual</option>
      </select>
    </div>
  </div>

  <!-- Memories list -->
  <div class="phant-card">
    <span class="phant-section-label">Memories (<span id="mem-count">—</span>)</span>
    <div id="memories-list">
      <div class="text-xs text-gray-300">Loading...</div>
    </div>
  </div>

</div>

<!-- Add Memory Modal -->
<div id="add-memory-modal" class="hidden fixed inset-0 z-[300] flex items-end sm:items-center justify-center bg-black/40">
  <div class="bg-white rounded-t-2xl sm:rounded-2xl w-full sm:max-w-lg p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-bold text-gray-900">Add Memory</h2>
      <button onclick="document.getElementById('add-memory-modal').classList.add('hidden')"
        class="text-gray-400 hover:text-gray-700">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form onsubmit="submitMemory(event)" class="space-y-3">
      <div>
        <label class="text-xs font-semibold text-gray-500 block mb-1">Content</label>
        <textarea name="content" rows="3" required placeholder="State a belief, fact, goal, or risk..."
          class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:border-gray-400 resize-none"></textarea>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-gray-500 block mb-1">Type</label>
          <select name="memory_type"
            class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2">
            <option value="observation">Observation</option>
            <option value="belief">Belief</option>
            <option value="fact">Fact</option>
            <option value="goal">Goal</option>
            <option value="commitment">Commitment</option>
            <option value="risk">Risk</option>
            <option value="opportunity">Opportunity</option>
            <option value="pattern">Pattern</option>
            <option value="preference">Preference</option>
            <option value="identity">Identity</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-500 block mb-1">Confidence</label>
          <input name="confidence" type="number" min="0" max="1" step="0.05" value="0.7"
            class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2"/>
        </div>
      </div>
      <div id="mem-error" class="hidden text-xs text-red-500"></div>
      <button type="submit"
        class="w-full bg-gray-900 text-white text-sm font-semibold py-2.5 rounded-xl hover:bg-gray-700">
        Save Memory
      </button>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
let _debounceTimer;
function debounceLoad() { clearTimeout(_debounceTimer); _debounceTimer = setTimeout(loadMemories, 400); }

loadMemories();

async function loadMemories() {
  const search  = document.getElementById('search-input')?.value.trim() || '';
  const type    = document.getElementById('type-filter')?.value || '';
  const product = document.getElementById('product-filter')?.value || '';

  let url = '/phant/memories?limit=50';
  if (search)  url += '&search=' + encodeURIComponent(search);
  if (type)    url += '&memory_type=' + encodeURIComponent(type);
  if (product) url += '&product=' + encodeURIComponent(product);

  try {
    const r = await fetch(url);
    const d = await r.json();
    document.getElementById('mem-count').textContent = d.count ?? 0;
    renderMemories(d.memories || []);
  } catch(_) {
    document.getElementById('memories-list').innerHTML = '<span class="text-xs text-red-400">Failed to load.</span>';
  }
}

function renderMemories(items) {
  const el = document.getElementById('memories-list');
  if (!items.length) { el.innerHTML = '<span class="text-xs text-gray-300">No memories found.</span>'; return; }
  el.innerHTML = items.map(function(m) {
    const badge = {'risk':'phant-badge-risk','goal':'phant-badge-goal','commitment':'phant-badge-commitment','fact':'phant-badge-fact','opportunity':'phant-badge-goal'}[m.memory_type] || 'phant-badge-fact';
    return `<div class="phant-table-row">
      <div class="flex flex-col flex-1 gap-1">
        <div class="flex items-center gap-2 flex-wrap">
          <span class="phant-badge ${badge}">${esc(m.memory_type)}</span>
          <span class="text-xs text-gray-400">${esc(m.product_source)}</span>
          ${!m.is_verified ? '<span class="text-xs text-amber-500">unverified</span>' : ''}
        </div>
        <span class="text-sm text-gray-700">${esc(m.content)}</span>
        <span class="text-xs text-gray-300">${m.created_at ? new Date(m.created_at).toLocaleDateString() : ''}</span>
      </div>
      <div class="flex flex-col items-end gap-1 flex-shrink-0">
        <span class="text-sm font-semibold text-gray-600">${Math.round((m.confidence||0)*100)}%</span>
        <button onclick="archiveMemory('${m.id}')" class="text-xs text-gray-300 hover:text-red-400">Archive</button>
      </div>
    </div>`;
  }).join('');
}

async function archiveMemory(id) {
  if (!confirm('Archive this memory?')) return;
  try {
    await fetch('/phant/memories/' + id, {method:'DELETE'});
    loadMemories();
  } catch(_) {}
}

async function submitMemory(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = {
    content:     fd.get('content'),
    memory_type: fd.get('memory_type') || 'observation',
    confidence:  parseFloat(fd.get('confidence') || '0.7'),
    is_verified: true,
  };
  try {
    const r = await fetch('/phant/memories', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('failed');
    document.getElementById('add-memory-modal').classList.add('hidden');
    e.target.reset();
    loadMemories();
  } catch(_) {
    document.getElementById('mem-error').textContent = 'Save failed.';
    document.getElementById('mem-error').classList.remove('hidden');
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
{% endblock %}
