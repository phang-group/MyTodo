<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — MyTodo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Segoe UI', system-ui, sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-gray-900 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-900">Create Account</h1>
      <p class="text-sm text-gray-500 mt-1">Internal access only</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 mb-5">{{ error }}</div>
    {% endif %}

    <form action="/register" method="post" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Full Name</label>
        <input type="text" name="name" required autofocus
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Email</label>
        <input type="email" name="email" required
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Password</label>
        <input type="password" name="password" required minlength="8"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
      </div>
      <button type="submit"
        class="w-full bg-gray-900 hover:bg-gray-700 text-white py-3 rounded-xl font-semibold text-sm">
        Create Account
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-4">
      Already registered? <a href="/login" class="text-gray-700 underline">Sign in</a>
    </p>
  </div>
</body>
</html>
