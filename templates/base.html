<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}MyTodo{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#111827', light: '#F3F4F6', muted: '#6B7280' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .priority-critical { border-left: 3px solid #EF4444; }
    .priority-high     { border-left: 3px solid #F59E0B; }
    .priority-medium   { border-left: 3px solid #6B7280; }
    .likelihood-high   { color: #16A34A; }
    .likelihood-mid    { color: #D97706; }
    .likelihood-low    { color: #DC2626; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">

  {% if user is defined and user %}
  <nav class="bg-white border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2">
        <div class="w-7 h-7 bg-gray-900 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
        </div>
        <span class="font-bold text-gray-900">MyTodo</span>
      </a>
      <div class="flex items-center gap-4 text-sm">
        <a href="/goals/new" class="bg-gray-900 text-white px-4 py-2 rounded-lg font-medium hover:bg-gray-700">
          + New Goal
        </a>
        <a href="/onboarding" class="text-gray-500 hover:text-gray-800">State</a>
        <form action="/logout" method="post" class="inline">
          <button type="submit" class="text-gray-400 hover:text-gray-700 text-xs">Sign out</button>
        </form>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
