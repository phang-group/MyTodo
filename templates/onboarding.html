{% extends "base.html" %}
{% block title %}Your Current State — MyTodo{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto">
  <div class="mb-8">
    <h1 class="text-2xl font-bold text-gray-900">Your Current State</h1>
    <p class="text-gray-500 text-sm mt-1">The AI reasons against this reality. Be accurate — optimism here produces useless plans.</p>
  </div>

  <form action="/onboarding" method="post" class="space-y-5">

    <!-- Financials -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
      <h2 class="font-semibold text-gray-900 mb-4 text-sm uppercase tracking-wide">Financial State</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Monthly Income (NGN)</label>
          <input type="number" name="monthly_income" min="0" required
            value="{{ state.monthly_income if state else '' }}"
            placeholder="e.g. 250000"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Monthly Expenses (NGN)</label>
          <input type="number" name="monthly_expenses" min="0" required
            value="{{ state.monthly_expenses if state else '' }}"
            placeholder="e.g. 180000"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Total Savings (NGN)</label>
          <input type="number" name="savings" min="0" required
            value="{{ state.savings if state else '' }}"
            placeholder="e.g. 500000"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
        </div>
      </div>
    </div>

    <!-- Context -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
      <h2 class="font-semibold text-gray-900 mb-4 text-sm uppercase tracking-wide">Context</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Location</label>
          <input type="text" name="location"
            value="{{ state.location if state else 'Lagos, Nigeria' }}"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5">Employment Status</label>
          <select name="employment_type" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400">
            <option value="employed" {% if state and state.employment_type == 'employed' %}selected{% endif %}>Employed</option>
            <option value="self-employed" {% if state and state.employment_type == 'self-employed' %}selected{% endif %}>Self-Employed</option>
            <option value="unemployed" {% if state and state.employment_type == 'unemployed' %}selected{% endif %}>Unemployed</option>
            <option value="student" {% if state and state.employment_type == 'student' %}selected{% endif %}>Student</option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Skills <span class="font-normal text-gray-400">— comma separated</span></label>
        <input type="text" name="skills"
          value="{{ state.skills_list()|join(', ') if state else '' }}"
          placeholder="e.g. Python, Sales, Graphic Design, Teaching"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
      </div>
      <div class="mb-4">
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Constraints <span class="font-normal text-gray-400">— what's working against you</span></label>
        <input type="text" name="constraints"
          value="{{ state.constraints_list()|join(', ') if state else '' }}"
          placeholder="e.g. No passport, Family obligations, Unstable income"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400"/>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1.5">Additional Context <span class="font-normal text-gray-400">optional</span></label>
        <textarea name="notes" rows="3"
          placeholder="Anything else the AI should know about your situation — debts, dependants, health, other commitments..."
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gray-400 resize-none">{{ state.notes if state else '' }}</textarea>
      </div>
    </div>

    <button type="submit"
      class="w-full bg-gray-900 hover:bg-gray-700 text-white py-4 rounded-xl font-bold text-sm">
      Save State{% if not state %} & Continue{% endif %}
    </button>
  </form>
</div>

{% endblock %}
